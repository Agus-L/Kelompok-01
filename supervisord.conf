# Konfigurasi Supervisor untuk Laravel Queue Worker KampusLMS
# File ini diletakkan di /etc/supervisor/conf.d/kampuslms-worker.conf di server production

[program:kampuslms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kampuslms/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/kampuslms/storage/logs/worker.log
stopwaitsecs=3600

